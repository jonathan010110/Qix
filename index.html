<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qix – SVG Spielfeld</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Qix – SVG Spielfeld</h1>

  <svg
    id="game"
    viewBox="0 0 900 650"
    width="900"
    height="650"
    role="img"
    aria-label="Qix Spielfeld"
  >
    <!-- Hintergrund -->
    <rect class="bg" x="0" y="0" width="900" height="650" />

    <!-- Spielfeld-Gruppe -->
    <g id="playfield" transform="translate(70 70)">
      <!-- Innenfläche -->
      <rect class="inside" x="0" y="0" width="760" height="510" />

      <!-- OPTIONAL: Grid -->
      <g class="grid">
        <!-- vertikale Linien -->
        <!-- step=25, width=760 -->
        <!-- (das ist absichtlich simpel statisch; später könnt ihr das per JS generieren) -->
        <line x1="0"   y1="0" x2="0"   y2="510" />
        <line x1="25"  y1="0" x2="25"  y2="510" />
        <line x1="50"  y1="0" x2="50"  y2="510" />
        <line x1="75"  y1="0" x2="75"  y2="510" />
        <line x1="100" y1="0" x2="100" y2="510" />
        <line x1="125" y1="0" x2="125" y2="510" />
        <line x1="150" y1="0" x2="150" y2="510" />
        <line x1="175" y1="0" x2="175" y2="510" />
        <line x1="200" y1="0" x2="200" y2="510" />
        <line x1="225" y1="0" x2="225" y2="510" />
        <line x1="250" y1="0" x2="250" y2="510" />
        <line x1="275" y1="0" x2="275" y2="510" />
        <line x1="300" y1="0" x2="300" y2="510" />
        <line x1="325" y1="0" x2="325" y2="510" />
        <line x1="350" y1="0" x2="350" y2="510" />
        <line x1="375" y1="0" x2="375" y2="510" />
        <line x1="400" y1="0" x2="400" y2="510" />
        <line x1="425" y1="0" x2="425" y2="510" />
        <line x1="450" y1="0" x2="450" y2="510" />
        <line x1="475" y1="0" x2="475" y2="510" />
        <line x1="500" y1="0" x2="500" y2="510" />
        <line x1="525" y1="0" x2="525" y2="510" />
        <line x1="550" y1="0" x2="550" y2="510" />
        <line x1="575" y1="0" x2="575" y2="510" />
        <line x1="600" y1="0" x2="600" y2="510" />
        <line x1="625" y1="0" x2="625" y2="510" />
        <line x1="650" y1="0" x2="650" y2="510" />
        <line x1="675" y1="0" x2="675" y2="510" />
        <line x1="700" y1="0" x2="700" y2="510" />
        <line x1="725" y1="0" x2="725" y2="510" />
        <line x1="750" y1="0" x2="750" y2="510" />
      </g>

      <!-- Rahmen -->
      <rect class="border" x="0" y="0" width="760" height="510" />
    </g>
  </svg>
</body>
</html>
