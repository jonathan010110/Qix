<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG Test</title>
</head>
<body style="margin:0; padding:20px; background:#111; color:#fff; font-family:sans-serif;">
  <h1 style="margin:0 0 12px;">SVG Test</h1>

  <svg viewBox="0 0 900 650" width="900" height="650" style="display:block; border:1px solid #444;">
    <!-- Hintergrund -->
    <rect x="0" y="0" width="900" height="650" style="fill:#000 !important;"></rect>

    <!-- Spielfeld -->
    <g transform="translate(70 70)">
      <rect x="0" y="0" width="760" height="510" style="fill:#1b2a6b !important;"></rect>
      <rect x="0" y="0" width="760" height="510"
            style="fill:none !important; stroke:#fff !important; stroke-width:8 !important;"></rect>
    </g>
  </svg>
</body>
</html>
